[workspace]
resolver = "2"
members = ["crates/sigrun-core", "crates/sigrun-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/mojoaar/sigrun"

[workspace.dependencies]
sigrun-core = { path = "crates/sigrun-core" }
anyhow = "1"
argon2 = "0.5"
assert_cmd = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
ed25519-dalek = "2"
fs2 = "0.4"
libc = "0.2"
p256 = "0.13"
predicates = "3"
rand = "0.8"
rsa = "0.9"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
ssh-agent-lib = "0.6"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "encryption", "getrandom"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-build = "2"
tauri-plugin-dialog = "~2.7"
tauri-plugin-single-instance = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "~7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
